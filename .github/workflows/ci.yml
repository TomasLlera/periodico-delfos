# Los chequeos que hasta ahora se corrían a mano, en cada push y cada PR.
#
# El build corre sin variables de Supabase a propósito: `haySupabase()` hace
# que no se prerenderice nada desde la base, y así se comprueba que el sitio
# compila aunque el proyecto no exista. La suite e2e queda afuera porque
# necesita la base y el usuario de prueba.
#
# El audit mira sólo dependencias de producción (`--prod`): las de build y test
# —ESLint, Vitest— no llegan al servidor, y un CI rojo por ellas se termina
# ignorando.

name: CI

on:
  push:
  pull_request:

jobs:
  chequeos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toma la versión de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Vulnerabilidades en dependencias de producción
        run: pnpm audit --prod --audit-level high
